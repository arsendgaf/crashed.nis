name: Deploy API (Cloudflare Workers)

# Deploys the Hono API to Cloudflare Workers when release-please publishes a
# release tag (v*), or manually from the Actions tab. Never runs on plain
# commits — releases gate production.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy crashed-nis-api
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck & test (release gate)
        run: bun run --cwd apps/api typecheck && bun run --cwd apps/api test

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: deploy

      - name: Smoke check deployed health endpoint
        if: vars.API_HEALTH_URL != ''
        run: |
          sleep 5
          curl -fsS "${{ vars.API_HEALTH_URL }}/health" -w '\nHTTP %{http_code}\n'
