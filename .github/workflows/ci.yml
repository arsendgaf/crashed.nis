name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # @crashed-nis/types ships compiled dist/ output; the shared package must
      # be built before dependent workspaces typecheck, test, or build.
      - name: Build shared packages
        run: bun run --cwd packages/types build

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      # Browser Mode runs renderer component tests in Chromium through the
      # Playwright provider; CI runners need the browser binary and system libs.
      - name: Install Playwright Chromium
        run: bun x playwright install --with-deps chromium

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
